name: Release

# M6-T9 — 태그 push(v*) 시 desktop-build.yml(M6-T8b)을 workflow_call로 재사용해
# mac/win 설치 파일을 만들고, 그 태그의 GitHub Release에 자산으로 첨부한다.
# 해당 태그에 Release가 아직 없으면 새로 만든다(초안 — §5.5 D5/D6과 같은 관례로
# 공개 전환은 사람이 gh release edit --draft=false로 최종 확인 후 수행).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # LR-T5 — 각 OS 빌드 잡이 draft Release 에 설치 파일을 직접 붙인다 (desktop-build.yml 의
  # release_tag 입력). 예전의 "아티팩트로 모았다가 publish 잡에서 첨부" 는 태그마다 1.2GB 를
  # Actions 스토리지에 쌓아 쿼터 초과로 실패했다.
  build:
    uses: ./.github/workflows/desktop-build.yml
    with:
      release_tag: ${{ github.ref_name }}
