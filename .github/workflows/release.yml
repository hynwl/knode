name: Release

# M6-T9 — 태그 push(v*) 시 desktop-build.yml(M6-T8b)을 workflow_call로 재사용해
# mac/win 설치 파일을 만들고, 그 태그의 GitHub Release에 자산으로 첨부한다.
# 해당 태그에 Release가 아직 없으면 새로 만든다(초안 — §5.5 D5/D6과 같은 관례로
# 공개 전환은 사람이 gh release edit --draft=false로 최종 확인 후 수행).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/desktop-build.yml

  publish:
    name: Attach installers to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Collect installer files
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-assets/*
