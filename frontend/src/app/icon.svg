<!--
  브라우저 탭 아이콘. `panels/Brand.tsx::BrandMark` 와 같은 그림이다 —
  붓질 한 획(인디고→로즈) + 그 끝에 붙는 노드 하나.
  path/circle 좌표는 마크의 64 격자 값 그대로이고, viewBox 로 마크 바깥
  여백만 잘라 32px 안을 꽉 채웠다(마크 실측 bbox 43×42 → 48 격자 중앙).
  색은 `design/tokens.ts` 의 color.indigo/rose 와 동일하다.
  (파일 하나짜리 정적 자산이라 토큰을 import 할 수 없어 값을 복제한다 —
   `frontend/src/design/noHardcodedColors.test.ts` 는 .ts/.tsx 만 본다.)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="7 9.5 48 48" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="m" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <path d="M14 50 C 18 34 27 25 37 22" stroke="url(#m)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="46" cy="19" r="6.5" fill="#6366f1"/>
</svg>
